        <h2>New version</h2>

<form class="new_version" id="new_version" enctype="multipart/form-data" action="/projects/ecookbook/versions" accept-charset="UTF-8" name="new_version-RANDOM" method="post"><input type="hidden" name="authenticity_token" value="{{CSRF}}" autocomplete="off" />



<div class="box tabular">
<p><label for="version_name">Name<span class="required"> *</span></label><input maxlength="60" size="60" type="text" name="version[name]" id="version_name" /></p>
<p><label for="version_description">Description</label><input size="60" type="text" value="" name="version[description]" id="version_description" /></p>
<p><label for="version_wiki_page_title">Wiki page</label><input size="60" type="text" name="version[wiki_page_title]" id="version_wiki_page_title" /></p>

//<![CDATA[
$(function() { $('#version_effective_date').addClass('date').datepickerFallback(datepickerOptions); });
//]]>
</script></p>
<p><label for="version_sharing">Sharing</label><select name="version[sharing]" id="version_sharing"><option selected="selected" value="none">Not shared</option>
<option value="descendants">With subprojects</option>
<option value="hierarchy">With project hierarchy</option>
<option value="tree">With project tree</option></select></p>
<p><label for="version_default_project_version">Default version</label><input name="version[default_project_version]" type="hidden" value="0" autocomplete="off" /><input type="checkbox" value="1" name="version[default_project_version]" id="version_default_project_version" /></p>
