        <h2>Version</h2>

<form class="edit_version" id="edit_version_3" enctype="multipart/form-data" action="/versions/3" accept-charset="UTF-8" name="edit_version_3-RANDOM" method="post"><input type="hidden" name="_method" value="patch" autocomplete="off" /><input type="hidden" name="authenticity_token" value="{{CSRF}}" autocomplete="off" />



<div class="box tabular">
<p><label for="version_name">Name<span class="required"> *</span></label><input maxlength="60" size="60" type="text" value="2.0" name="version[name]" id="version_name" /></p>
<p><label for="version_description">Description</label><input size="60" type="text" value="Future version" name="version[description]" id="version_description" /></p>
  <p><label for="version_status">Status</label><select name="version[status]" id="version_status"><option selected="selected" value="open">open</option>
<option value="locked">locked</option>
<option value="closed">closed</option></select></p>
<p><label for="version_wiki_page_title">Wiki page</label><input size="60" type="text" name="version[wiki_page_title]" id="version_wiki_page_title" /></p>
<p><label for="version_effective_date">Due date</label><input max="9999-12-31" size="10" type="date" name="version[effective_date]" id="version_effective_date" /><script>
//<![CDATA[
$(function() { $('#version_effective_date').addClass('date').datepickerFallback(datepickerOptions); });
//]]>
</script></p>
<p><label for="version_sharing">Sharing</label><select name="version[sharing]" id="version_sharing"><option selected="selected" value="none">Not shared</option>
<option value="descendants">With subprojects</option>
<option value="hierarchy">With project hierarchy</option>
<option value="tree">With project tree</option></select></p>
