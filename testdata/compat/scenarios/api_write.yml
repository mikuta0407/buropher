    expect_status: 204
  - id: issue_update_xml
    path: /issues/2.xml
    method: PUT
    user: jsmith
    content_type: application/xml
    body: '<?xml version="1.0"?><issue><notes>xml note</notes><done_ratio>50</done_ratio></issue>'
