# REST API の書き込み（POST / PUT / PATCH / DELETE）の互換シナリオ（test/integration/api_test の作成・更新・削除）。
# 状態を変えるため、共用の参照環境（3998）ではなく専用の参照インスタンスに対して、
# 参照・候補とも実行前に reset して流すこと（-reset-ref / -reset-cand）:
#   COMPAT_REF_DIR=.../_reference/ref-api COMPAT_REF_PORT=4036 tools/compat/redmine-ref.sh start
# ケースは記述順に依存する（作成したレコードの id を後続で使う）。
name: api_write

users:
  admin: {login: admin, password: admin}
  jsmith: {login: jsmith, password: jsmith}
  dlopper: {login: dlopper, password: foo}

normalize:
  mask_keys: [api_key]
  # 作成・更新したレコードの日時は実時刻（候補の時計は固定時刻から進む）
  mask_timestamps: true

requests:
  # ---- uploads（attachments/upload.api.rsb）
  - id: upload_json
    path: /uploads.json?filename=test.txt
    method: POST
    user: jsmith
    content_type: application/octet-stream
    body: 'hello world'
    expect_status: 201
    capture_body: {tok1: '"token":"([0-9a-f.]+)"'}
  - id: upload_xml
    path: /uploads.xml?filename=second.txt
    method: POST
    user: jsmith
    content_type: application/octet-stream
    body: 'second file'
    expect_status: 201
    capture_body: {tok2: '<token>([0-9a-f.]+)</token>'}
  - id: upload_json_for_files
    path: /uploads.json?filename=release.txt
    method: POST
    user: jsmith
    content_type: application/octet-stream
    body: 'release file'
    expect_status: 201
    capture_body: {tok3: '"token":"([0-9a-f.]+)"'}
  - id: upload_wrong_content_type
    path: /uploads.json
    method: POST
    user: jsmith
    content_type: application/json
    body: '{"x":1}'
  - id: upload_anonymous
    path: /uploads.json
    method: POST
    user: anonymous
    content_type: application/octet-stream
    body: 'anon'

  # ---- issues
  - id: issue_create_json
    path: /issues.json
    method: POST
    user: jsmith
    content_type: application/json
    body: '{"issue":{"project_id":1,"tracker_id":2,"status_id":3,"subject":"API test","priority_id":4,"description":"API description","custom_fields":[{"id":2,"value":"Foo"}],"uploads":[{"token":"${tok1}","filename":"test.txt","content_type":"text/plain","description":"uploaded"}]}}'
    expect_status: 201
  - id: issue_create_xml
    path: /issues.xml
