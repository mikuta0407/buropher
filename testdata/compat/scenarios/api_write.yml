    user: jsmith
    content_type: application/xml
    body: '<?xml version="1.0"?><issue><project_id>1</project_id><tracker_id>1</tracker_id><subject>XML issue</subject><priority_id>5</priority_id><watcher_user_ids type="array"><watcher_user_id>3</watcher_user_id></watcher_user_ids></issue>'
    expect_status: 201
  - id: issue_create_invalid_json
