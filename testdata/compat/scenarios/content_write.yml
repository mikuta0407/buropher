# ニュース・コメント・文書・ファイル・フォーラム・メッセージ・ウォッチャー・添付の状態を変える互換シナリオ。
# 参照は専用インスタンスで実行前に reset すること:
#   COMPAT_REF_DIR=_reference/ref-content COMPAT_REF_PORT=4018 tools/compat/redmine-ref.sh start
#   go run ./tools/compat diff -ref http://127.0.0.1:4018 -cand http://127.0.0.1:4118 \
#     -reset-ref 'COMPAT_REF_DIR=... COMPAT_REF_PORT=4018 tools/compat/redmine-ref.sh reset' \
#     -reset-cand 'BUROPHER_CAND_PORT=4118 BUROPHER_CAND_DIR=... tools/compat/buropher-cand.sh reset' \
#     -run '^content_write/'
# ケースは記述順に実行され、前のケースの結果に依存する（作成したニュース id 4・5、添付 id 25 以降など）。
name: content_write

users:
  admin: {login: admin, password: admin}
  jsmith: {login: jsmith, password: jsmith}
  dlopper: {login: dlopper, password: foo}

normalize:
  mask_text_selectors:
    - "#footer"
  # JS 応答の文字列に埋め込まれた CSRF トークンとフォームの name 属性の乱数部
  regex:
    - {pattern: 'value=\\"[A-Za-z0-9_-]{40,}\\"', replace: 'value=\"TOKEN\"'}
    - {pattern: 'new-watcher-form-[0-9a-f]{8}', replace: 'new-watcher-form-RANDOM'}

requests:
  # ---- ニュース ----
  - id: news_create_invalid
    path: /projects/ecookbook/news
    method: POST
    user: jsmith
    form: {"news[title]": "", "news[summary]": "s", "news[description]": ""}
  - id: news_create_too_long
    path: /projects/ecookbook/news
    method: POST
    user: jsmith
    form: {"news[title]": "0123456789012345678901234567890123456789012345678901234567890123456789", "news[description]": "d"}
  - id: upload_for_news
    path: /uploads.json?filename=hello.txt
    method: POST
    user: jsmith
    content_type: application/octet-stream
    body: 'hello world'
  - id: news_create_invalid_with_upload
    path: /projects/ecookbook/news
    method: POST
    user: jsmith
    form: {"news[title]": "", "news[description]": "d", "attachments[1][token]": "25.b94d27b9934d3e08a52e52d7da7dabfac484efe37a5380ee9088f7ace2efcde9", "attachments[1][description]": "readme"}
  - id: news_create
    path: /projects/ecookbook/news
    method: POST
    user: jsmith
    form: {"news[title]": "New release", "news[summary]": "Summary text", "news[description]": "Released *today* with #1", "attachments[1][token]": "25.b94d27b9934d3e08a52e52d7da7dabfac484efe37a5380ee9088f7ace2efcde9", "attachments[1][description]": "readme"}
    expect_status: 302
  - path: /projects/ecookbook/news
    id: news_index_after_create
    users: [jsmith]
  - path: /news/4
    id: news_show_after_create
    users: [jsmith, admin]
  - path: /news/4.json?include=attachments
    id: news_api_after_create
    users: [admin]
  - id: news_create_cross_project
    path: /news
    method: POST
    user: admin
    form: {"news[title]": "Cross project", "news[description]": "Body", "project_id": "2", "cross_project": "1"}
    expect_status: 302
  - path: /news
    id: news_global_after_cross
    users: [admin]
  - id: news_create_cross_project_missing
    path: /news
    method: POST
    user: admin
    form: {"news[title]": "No project", "news[description]": "Body"}
  - id: news_update_invalid
    path: /news/1
    method: PUT
    user: jsmith
    form: {"news[title]": "", "news[description]": "x"}
  - id: news_update
    path: /news/1
    method: PATCH
    user: jsmith
    form: {"news[title]": "Updated title", "news[summary]": "", "news[description]": "Updated description"}
    expect_status: 302
  - path: /news/1
    id: news_show_after_update
    users: [jsmith]
  - id: news_update_denied
    path: /news/1
    method: PUT
    user: dlopper
    form: {"news[title]": "x"}

