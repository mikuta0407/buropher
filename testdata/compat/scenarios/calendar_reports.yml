# カレンダー（CalendarsController#show）とレポート（ReportsController#issue_report / issue_report_details）。
# すべて GET。参照環境は共有でリセットしないため、閲覧で変わる状態（最近使ったプロジェクト・
# ブックマーク）が出るプロジェクトジャンプボックスは比較から外す。
# retrieve_query は session[:issue_query] を使うため、セッションごとの状態に依存しないよう
# 各リクエストは set_filter / query_id 付きか、セッションに何も無い状態で始まる順に並べる。
name: calendar_reports

users:
  admin: {login: admin, password: admin}
  jsmith: {login: jsmith, password: jsmith}
  dlopper: {login: dlopper, password: foo}

normalize:
  mask_text_selectors:
    - "#footer"
  strip_selectors:
    - "#project-jump"

requests:
  # ---- カレンダー（全体）
  - path: /issues/calendar
    users: [anonymous, admin, jsmith, dlopper]
  - path: /issues/calendar?month=2&year=2026
    users: [admin, jsmith]
  - path: /issues/calendar?month=12&year=2025
    users: [admin]
  - path: /issues/calendar?month=7&year=2006&set_filter=1&f[]=
    users: [admin, anonymous]
  - path: /issues/calendar?year=1800&month=13
    users: [admin]
  - path: /issues/calendar?year=2026&month=0
    users: [jsmith]
  - path: /issues/calendar?set_filter=1&f[]=tracker_id&op[tracker_id]==&v[tracker_id][]=1
    users: [jsmith]
  - path: /issues/calendar?set_filter=1&f[]=assigned_to_id&op[assigned_to_id]==&v[assigned_to_id][]=me
    users: [dlopper]
  - path: /issues/calendar?set_filter=1&f[]=start_date&op[start_date]=%3E%3C&v[start_date][]=foo
    users: [admin]
  - path: /issues/calendar?query_id=5
    users: [admin, jsmith]
  - path: /issues/calendar?query_id=3
    users: [dlopper, jsmith]
  - path: /issues/calendar?query_id=999
    users: [admin]
  - path: /issues/calendar?query_id=1
    users: [admin]
  # ---- カレンダー（プロジェクト）
  - path: /projects/ecookbook/issues/calendar?set_filter=1
    users: [anonymous, admin, jsmith, dlopper]
  - path: /projects/ecookbook/issues/calendar?month=2&year=2026&set_filter=1
    users: [admin, jsmith]
  - path: /projects/onlinestore/issues/calendar?set_filter=1
    users: [anonymous, admin, jsmith, dlopper]
  - path: /projects/ecookbook/issues/calendar?query_id=1
    users: [jsmith]
  - path: /projects/ecookbook/issues/calendar?query_id=2
    users: [jsmith, dlopper]
  - path: /projects/subproject1/issues/calendar?set_filter=1
    users: [admin]
  - path: /projects/unknown/issues/calendar
    users: [admin, anonymous]
  - path: /projects/1/issues/calendar?set_filter=1&month=1&year=2026
    users: [jsmith]
  # ---- レポート
  - path: /projects/ecookbook/issues/report
    users: [anonymous, admin, jsmith, dlopper]
  - path: /projects/onlinestore/issues/report
    users: [anonymous, admin, jsmith, dlopper]
  - path: /projects/subproject1/issues/report
    users: [admin]
  - path: /projects/ecookbook/issues/report/tracker
    users: [admin, jsmith]
  - path: /projects/ecookbook/issues/report/version
    users: [admin, jsmith]
  - path: /projects/ecookbook/issues/report/priority
    users: [admin, jsmith]
  - path: /projects/ecookbook/issues/report/category
    users: [admin, jsmith]
  - path: /projects/ecookbook/issues/report/assigned_to
    users: [admin, jsmith, anonymous]
  - path: /projects/ecookbook/issues/report/author
    users: [admin, jsmith]
  - path: /projects/ecookbook/issues/report/subproject
    users: [admin, jsmith, dlopper]
  - path: /projects/onlinestore/issues/report/tracker
    users: [admin]
  - path: /projects/ecookbook/issues/report/foo
    users: [admin]
  - path: /projects/ecookbook/issues/report/tracker.csv
    users: [admin]
  - path: /projects/ecookbook/issues/report/assigned_to.csv?encoding=ISO-8859-1
    users: [admin]
  - path: /projects/unknown/issues/report
    users: [admin]
