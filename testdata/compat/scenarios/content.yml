# ニュース・文書・ファイル・フォーラム・添付（NewsController / CommentsController / DocumentsController /
# FilesController / BoardsController / MessagesController / AttachmentsController / WatchersController）の
# 参照状態を変えない GET の互換シナリオ（REST API を含む）。
name: content

users:
  admin: {login: admin, password: admin}
  jsmith: {login: jsmith, password: jsmith}
  dlopper: {login: dlopper, password: foo}

normalize:
  mask_text_selectors:
    - "#footer"

requests:
  # ---- ニュース
  - path: /news
    users: [anonymous, admin, jsmith]
  - path: /projects/ecookbook/news
    users: [anonymous, admin, jsmith]
  - path: /projects/onlinestore/news
    users: [anonymous, jsmith]
  - path: /news?page=2
    users: [admin]
  - path: /news/new
    users: [anonymous, admin, jsmith]
  - path: /projects/ecookbook/news/new
    users: [admin, dlopper]
  - path: /news/1
    users: [anonymous, admin, jsmith, dlopper]
  - path: /news/2
    users: [admin]
  - path: /news/3
    users: [anonymous, jsmith]
  - path: /news/999
    users: [admin]
  - path: /news/1/edit
    users: [admin, dlopper]
  - path: /news.atom
    users: [anonymous]
  - path: /projects/ecookbook/news.atom
    users: [anonymous]
  - path: /news.json
    users: [admin, jsmith]
  - path: /news.xml?limit=2&offset=1
    users: [admin]
  - path: /projects/ecookbook/news.json
    users: [anonymous]
  - path: /news/1.json?include=attachments,comments
    users: [admin]
  - path: /news/1.xml?include=comments
    users: [admin]
  - path: /news/2.json
    users: [jsmith]

  # ---- 文書
  - path: /projects/ecookbook/documents
    users: [anonymous, admin, jsmith, dlopper]
  - path: /projects/ecookbook/documents?sort_by=date
    users: [admin]
  - path: /projects/ecookbook/documents?sort_by=title
    users: [admin]
  - path: /projects/ecookbook/documents?sort_by=author
    users: [admin]
  - path: /projects/ecookbook/documents?sort_by=bogus
    users: [jsmith]
  - path: /projects/onlinestore/documents
    users: [anonymous, jsmith]
  - path: /projects/ecookbook/documents/new
    users: [admin, dlopper]
  - path: /documents/1
    users: [anonymous, admin, jsmith]
  - path: /documents/2
    users: [admin]
  - path: /documents/3
    users: [admin]
  - path: /documents/999
    users: [admin]
  - path: /documents/1/edit
    users: [admin, dlopper]

  # ---- ファイル
  - path: /projects/ecookbook/files
    users: [anonymous, admin, jsmith, dlopper]
  - path: /projects/ecookbook/files?sort=size:desc
    users: [admin]
  - path: /projects/ecookbook/files?sort=downloads
    users: [admin]
  - path: /projects/ecookbook/files?sort=created_on:desc,filename
    users: [admin]
  - path: /projects/ecookbook/files
    id: projects_ecookbook_files_session_sort
    users: [admin]
  - path: /projects/onlinestore/files
    users: [anonymous, jsmith]
  - path: /projects/ecookbook/files/new
    users: [admin, jsmith, dlopper]
  - path: /projects/ecookbook/files.json
    users: [admin]
  - path: /projects/ecookbook/files.xml
    users: [jsmith]

  # ---- フォーラム
  - path: /projects/ecookbook/boards
    users: [anonymous, admin, jsmith, dlopper]
  - path: /projects/onlinestore/boards
    users: [anonymous, jsmith]
  - path: /projects/ecookbook/boards/1
    users: [anonymous, admin, jsmith, dlopper]
  - path: /projects/ecookbook/boards/1?sort=replies
    users: [admin]
  - path: /projects/ecookbook/boards/1?sort=created_on:desc
    users: [admin]
  - path: /projects/ecookbook/boards/1?per_page=1&page=2
    users: [admin]
  - path: /projects/ecookbook/boards/2
    users: [admin]
  - path: /projects/ecookbook/boards/3
    users: [admin]
  - path: /projects/ecookbook/boards/1.atom
    users: [anonymous]
  - path: /projects/ecookbook/boards/new
    users: [admin, dlopper]
  - path: /projects/ecookbook/boards/1/edit
    users: [admin]
  - path: /boards/1/topics/1
    users: [anonymous, admin, jsmith, dlopper]
  - path: /boards/1/topics/4
    users: [admin]
  - path: /boards/1/topics/1?r=3
    users: [admin]
  - path: /boards/1/topics/2
    users: [admin]
  - path: /boards/2/topics/1
    users: [admin]
  - path: /boards/1/topics/999
    users: [admin]
  - path: /boards/1/topics/new
    users: [anonymous, admin, jsmith]
  - path: /boards/1/topics/1/edit
    users: [admin, jsmith, dlopper]
  - path: /boards/1/topics/2/edit
    users: [admin]
  - path: /boards/1/topics/quote/1
    users: [admin]
  - path: /boards/1/topics/quote/1.js
    users: [admin]
  - path: /boards/1/topics/quote/2.js
    users: [jsmith]
  - path: /boards/1/topics/quote/3.js
    id: boards_1_topics_quote_3_xhr
    users: [admin]
    headers: {X-Requested-With: XMLHttpRequest}
  - path: /boards/1/topics/quote/1.js?quote=partial%20text
    id: boards_1_topics_quote_1_partial_xhr
    users: [admin]
    headers: {X-Requested-With: XMLHttpRequest}
  - path: /projects/ecookbook/boards/1
    id: projects_ecookbook_boards_1_xhr
    users: [admin]
    headers: {X-Requested-With: XMLHttpRequest}

  # ---- 添付ファイル
  - path: /attachments/4
    users: [anonymous, admin, jsmith]
  - path: /attachments/4/source.rb
    users: [admin]
  - path: /attachments/4/wrong.rb
    users: [admin]
  - path: /attachments/16
    users: [admin, jsmith, dlopper]
  - path: /attachments/6
    users: [admin]
  - path: /attachments/22
    users: [admin]
  - path: /attachments/23
    users: [admin]
  - path: /attachments/5
    users: [admin]
  - path: /attachments/14
    users: [admin]
  - path: /attachments/14?type=sbs
    users: [admin]
  - path: /attachments/14
    id: attachments_14_after_sbs
    users: [admin]
  - path: /attachments/2
    users: [admin]
  - path: /attachments/999
    users: [admin]
  - path: /attachments/4.json
    users: [admin]
  - path: /attachments/16.xml
    users: [jsmith]
  - path: /attachments/22.json
    users: [anonymous]
  - path: /attachments/documents/1/edit
    users: [admin, jsmith]
  - path: /attachments/issues/14/edit
    users: [admin]
  - path: /attachments/projects/1/edit
    users: [admin]
  - path: /attachments/news/1/edit
    users: [admin]
  - path: /attachments/messages/1/edit
    users: [admin, dlopper]
  - path: /attachments/bogus/1/edit
    users: [admin]
  - path: /attachments/issues/999/edit
    users: [admin]
