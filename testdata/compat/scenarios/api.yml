# REST API（app/views/**/*.api.rsb の全テンプレートと test/integration/api_test の読み取り系）の互換シナリオ。
# GET のみで状態を変えないため、共用の参照環境（3998）に対して流してよい（reset 不要）。
# 書き込み系は api_write.yml（専用の参照インスタンスで reset して流す）。
name: api

users:
  admin: {login: admin, password: admin}
  jsmith: {login: jsmith, password: jsmith}
  dlopper: {login: dlopper, password: foo}

normalize:
  # API キーは参照側では既存のトークン、候補側では生成値になる。
  # 共用の参照環境では他の利用者のログインで last_login_on が変わる（ログイン時刻は admin_users で確認する）
  # ため値を伏せる。
  mask_keys: [api_key, last_login_on]

requests:
  # ---- issues（issues/index.api.rsb, issues/show.api.rsb）
  - path: /issues.json
    users: [anonymous, admin, jsmith]
  - path: /issues.xml
    users: [anonymous, admin]
  - path: /issues.json?limit=3&offset=2
    users: [admin]
  - path: /issues.xml?limit=3&page=2
    users: [admin]
  - path: /issues.json?nometa=1&limit=2
    users: [admin]
  - id: issues_json_nometa_header
    path: /issues.json?limit=2
    user: admin
    headers: {X-Redmine-Nometa: "1"}
  - path: /issues.json?project_id=1&status_id=*&sort=id
    users: [admin]
  - path: /issues.json?project_id=ecookbook&subproject_id=!*
    users: [admin]
  - path: /issues.json?tracker_id=2&status_id=closed
    users: [admin]
  - path: /issues.json?assigned_to_id=me
    users: [jsmith]
  - path: /issues.json?cf_1=MySQL
    users: [admin]
  - path: /issues.json?issue_id=1,2,3&status_id=*
    users: [admin]
  - path: /issues.json?f[]=subject&op[subject]=~&v[subject][]=recipe
    users: [admin]
  - path: /issues.json?sort=priority:desc,id&limit=5
    users: [admin]
  - path: /issues.json?include=relations,attachments&status_id=*&limit=8
    users: [admin]
  - path: /issues.xml?include=relations,attachments&status_id=*&limit=8
    users: [admin]
  - path: /issues.json?query_id=1
    users: [admin]
  - path: /issues.json?limit=abc&offset=-3
    users: [admin]
  - path: /projects/ecookbook/issues.json
    users: [anonymous, admin]
  - path: /projects/onlinestore/issues.json
    users: [anonymous, jsmith]
  - path: /projects/999/issues.json
    users: [admin]
  - path: /issues/1.json
    users: [anonymous, admin, jsmith]
  - path: /issues/1.xml
    users: [admin]
  - path: /issues/1.json?include=children,attachments,relations,changesets,journals,watchers,allowed_statuses
    users: [admin, jsmith]
  - path: /issues/1.xml?include=children,attachments,relations,changesets,journals,watchers,allowed_statuses
    users: [admin]
  - path: /issues/2.json?include=journals,relations
    users: [admin, dlopper]
  - path: /issues/3.xml?include=attachments,journals
    users: [admin]
  - path: /issues/6.json
    users: [anonymous, admin, jsmith]
  - path: /issues/14.json?include=journals
    users: [admin, jsmith]
  - path: /issues/999.json
    users: [admin]
  - path: /issues/999.xml
    users: [anonymous]

  # ---- issue_relations
  - path: /issues/2/relations.json
