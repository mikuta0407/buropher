  # ---- 認証・ヘッダ・エラー形式
  - id: switch_user_jsmith
    path: /users/current.json
    user: admin
    headers: {X-Redmine-Switch-User: jsmith}
  - id: switch_user_invalid
    path: /users/current.json
    user: admin
    headers: {X-Redmine-Switch-User: foobar}
  - id: switch_user_by_non_admin
    path: /users/current.json
    user: jsmith
    headers: {X-Redmine-Switch-User: admin}
  - id: wrong_password
    path: /users/current.json
    user: admin
    auth: none
    headers: {Authorization: "Basic YWRtaW46d3Jvbmc="}
  - id: users_json_anonymous_forbidden
    path: /users.json
    user: anonymous
  - id: jsonp_disabled_callback
    path: /trackers.json?callback=handler
    user: admin
