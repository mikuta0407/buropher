    form:
      import_settings[mapping][project_id]: "3"
  - id: time_entries_mapping_post
    path: /imports/${te}/mapping
    method: POST
    user: jsmith
    form:
      import_settings[mapping][project_id]: "1"
      import_settings[mapping][activity]: "5"
      import_settings[mapping][issue_id]: "1"
      import_settings[mapping][spent_on]: "2"
      import_settings[mapping][hours]: "3"
      import_settings[mapping][comments]: "4"
      import_settings[mapping][cf_10]: "6"
      import_settings[mapping][user]: "7"
