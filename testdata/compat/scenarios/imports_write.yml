  - id: time_entries_admin_create
    path: /imports
    method: POST
    user: admin
    form: {type: "TimeEntryImport"}
    files: {file: ../files/imports/import_time_entries.csv}
    capture: {te2: '/imports/([0-9a-f]+)/settings'}
  - id: time_entries_admin_settings_post
