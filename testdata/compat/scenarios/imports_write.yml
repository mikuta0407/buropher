      import_settings[mapping][login]: "1"
      import_settings[mapping][firstname]: "2"
      import_settings[mapping][lastname]: "3"
      import_settings[mapping][mail]: "4"
      import_settings[mapping][language]: "5"
      import_settings[mapping][admin]: "6"
      import_settings[mapping][auth_source]: "7"
      import_settings[mapping][password]: "8"
      import_settings[mapping][must_change_passwd]: "9"
      import_settings[mapping][status]: "10"
      import_settings[mapping][cf_4]: "11"
  - id: users_run
    path: /imports/${users}/run
    users: [admin]
  - id: users_run_post
    path: /imports/${users}/run
    method: POST
    user: admin
    form: {x: "1"}

  - id: users_show
    path: /imports/${users}
    users: [admin]
  - id: users_show_again_errors
    path: /imports
    method: POST
    user: admin
    form: {type: "UserImport"}
    files: {file: ../files/imports/import_users.csv}
    capture: {users2: '/imports/([0-9a-f]+)/settings'}
  - id: users2_settings_post
    path: /imports/${users2}/settings
    method: POST
    user: admin
    form:
