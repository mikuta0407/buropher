  - id: automap_create
    path: /imports
    method: POST
    user: jsmith
    form: {type: "IssueImport"}
    files: {file: ../files/imports/import_issues_auto_mapping.csv}
    capture: {automap: '/imports/([0-9a-f]+)/settings'}
  - id: automap_settings_post
    path: /imports/${automap}/settings
    method: POST
    user: jsmith
    form:
      import_settings[separator]: ";"
      import_settings[wrapper]: '"'
      import_settings[encoding]: "ISO-8859-1"
  - id: automap_mapping
    path: /imports/${automap}/mapping
    users: [jsmith]
  - id: single_quote_create
    path: /imports
    method: POST
    user: jsmith
    form: {type: "IssueImport"}
    files: {file: ../files/imports/import_issues_single_quotation.csv}
    capture: {single: '/imports/([0-9a-f]+)/settings'}
  - id: single_quote_settings
    path: /imports/${single}/settings
    users: [jsmith]

  # ---- 工数 ----
  - id: time_entries_create
    path: /imports
    method: POST
    user: jsmith
    form: {type: "TimeEntryImport", project_id: "ecookbook"}
    files: {file: ../files/imports/import_time_entries.csv}
    capture: {te: '/imports/([0-9a-f]+)/settings'}
  - id: time_entries_settings_post
    path: /imports/${te}/settings
    method: POST
    user: jsmith
    form:
      import_settings[separator]: ";"
      import_settings[wrapper]: '"'
      import_settings[encoding]: "UTF-8"
