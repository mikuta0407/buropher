# Git リポジトリ（RepositoriesController / SysController）の互換シナリオ。
#
# 前提:
#   1. Redmine の git フィクスチャを展開しておく（参照・候補の両方が同じパスを使う）:
#        mkdir -p _reference/scm-test
#        tar xzf _reference/redmine/test/fixtures/repositories/git_repository.tar.gz -C _reference/scm-test
#        find _reference/scm-test -name '._*' -delete
#      ケース repo_create の repository[url] は展開先の絶対パス（環境に合わせて書き換える）。
#   2. 参照は専用インスタンス（共用の 3998 はリポジトリを持たない）:
#        COMPAT_REF_DIR=$PWD/_reference/ref-scm COMPAT_REF_PORT=4028 tools/compat/redmine-ref.sh start
#        BUROPHER_CAND_PORT=4128 BUROPHER_CAND_DIR=$PWD/data/cand tools/compat/buropher-cand.sh reset
#        go run ./tools/compat diff -ref http://127.0.0.1:4028 -cand http://127.0.0.1:4128 \
#          -reset-ref 'COMPAT_REF_DIR=$PWD/_reference/ref-scm COMPAT_REF_PORT=4028 tools/compat/redmine-ref.sh reset' \
#          -reset-cand 'BUROPHER_CAND_PORT=4128 BUROPHER_CAND_DIR=$PWD/data/cand tools/compat/buropher-cand.sh reset' \
#          -run '^scm_git/'
#
# 最初のケースで subproject1（Project 3）に Git リポジトリ（id 12、path_encoding ISO-8859-1、既定）を作成し、
# 2 番目のケース（show）で自動取得（Setting.autofetch_changesets の既定は有効）により 29 件のチェンジセットを取り込む。
# 以降のケースはその状態に依存する（記述順に実行すること）。
name: scm_git

users:
  admin: {login: admin, password: admin}
  jsmith: {login: jsmith, password: jsmith}

normalize:
  mask_text_selectors:
    - "#footer"
  regex:
    - {pattern: 'value=\\"[A-Za-z0-9_-]{40,}\\"', replace: 'value=\"TOKEN\"'}
    - {pattern: 'new-relation-form-[0-9a-f]{8}', replace: 'new-relation-form-RANDOM'}

requests:
  - id: repo_create
    path: /projects/subproject1/repositories
    method: POST
    user: admin
    form: {"repository_scm": "Git", "repository[url]": "/home/mikuta0407/projects/buropher/_reference/scm-test/git_repository", "repository[path_encoding]": "ISO-8859-1", "repository[identifier]": "", "repository[is_default]": "1", "repository[report_last_commit]": "0"}
    expect_status: 302
  - id: show_fetch
    path: /projects/subproject1/repository
    users: [admin]
  - id: show_anonymous
    path: /projects/subproject1/repository
    users: [anonymous, jsmith]
  - path: /projects/subproject1/repository/12
    users: [admin]
  - path: /projects/subproject1/repository/12?rev=test_branch
    users: [admin]
  - path: /projects/subproject1/repository/12?rev=tag01.annotated
    users: [admin]
  - path: /projects/subproject1/repository/12/revisions/master/show/sources
    users: [admin]
  - path: /projects/subproject1/repository/12/show/images
    users: [admin]
  - path: /projects/subproject1/repository/12/show/images?rev=7234cb2750b63f47bff735edc50a1c0a433c2518
    users: [admin]
  - path: /projects/subproject1/repository/12/show/latin-1-dir/test-%C3%9C-subdir?rev=1ca7f5ed374f3cb31a93ae5215c2e25cc6ec5127
    users: [admin]
  - path: /projects/subproject1/repository/12/browse/sources
    users: [admin]
  - id: show_xhr_tree
    path: /projects/subproject1/repository/12/revisions/master-20120212/show/sources?depth=1&parent_id=abc
    users: [admin]
    headers: {X-Requested-With: XMLHttpRequest}
  - id: new_xhr
    path: /projects/subproject1/repositories/new?repository_scm=Git
    users: [admin]
    headers: {X-Requested-With: XMLHttpRequest, Accept: "text/javascript, application/javascript, application/ecmascript, application/x-ecmascript, */*; q=0.01"}
  - path: /projects/subproject1/repository/12/changes/README
