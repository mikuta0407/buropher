<html>
  <head></head>
  <body>
    <div class="contextual">
      <a class="icon icon-add" href="/projects/ecookbook/documents/new" onclick="showAndScrollTo(&#34;add-document&#34;, &#34;document_title&#34;); return false;">
        <svg aria-hidden="true" class="s18 icon-svg">
          <use href="/assets/icons-DIGEST.svg#icon--add"></use>
        </svg>
        <span class="icon-label">New document</span>
      </a>
    </div>
    <div id="add-document" style="display:none;">
      <h2>New document</h2>
      <form accept-charset="UTF-8" action="/projects/ecookbook/documents" class="new_document" enctype="multipart/form-data" id="new_document" method="post" name="new_document-RANDOM">
        <input autocomplete="off" name="authenticity_token" type="hidden" value="{{CSRF}}">
        <div class="box tabular">
          <p>
            <label for="document_category_id">Category</label>
            <select id="document_category_id" name="document[category_id]">
              <option selected="selected" value="1">Uncategorized</option>
              <option value="2">User documentation</option>
              <option value="3">Technical documentation</option>
            </select>
          </p>
          <p>
            <label for="document_title">
              Title
              <span class="required">*</span>
            </label>
            <input id="document_title" name="document[title]" size="60" type="text" value="">
          </p>
          <p>
            <label for="document_description">Description</label>
            <textarea class="wiki-edit" cols="60" data-action="beforeinput-&gt;list-autofill#handleBeforeInput" data-auto-complete="true" data-controller="list-autofill" data-list-autofill-text-formatting-param="common_mark" id="document_description" name="document[description]" rows="15"></textarea>
          </p>
          <p>
            <label>Files</label>
            <span class="attachments_form">
              <span class="attachments_icons hidden">
                <svg aria-hidden="true" class="s18 icon-svg svg-del">
                  <use href="/assets/icons-DIGEST.svg#icon--del"></use>
                </svg>
                <svg aria-hidden="true" class="s16 icon-svg svg-attachment">
                  <use href="/assets/icons-DIGEST.svg#icon--attachment"></use>
                </svg>
                <svg aria-hidden="true" class="s16 icon-svg svg-loader">
                  <use href="/assets/icons-DIGEST.svg#icon--loader"></use>
                </svg>
                <svg aria-hidden="true" class="s16 icon-svg svg-hourglass">
                  <use href="/assets/icons-DIGEST.svg#icon--hourglass"></use>
                </svg>
              </span>
              <span class="attachments_fields"></span>
              <span class="add_attachment" style="">
                <input class="file_selector filedrop" data-description="true" data-description-placeholder="Optional description" data-max-concurrent-uploads="2" data-max-file-size="5242880" data-max-file-size-message="This file cannot be uploaded because it exceeds the maximum allowed file size (5 MB)" data-max-number-of-files-message="This file cannot be uploaded because it exceeds the maximum number of files that can be attached simultaneously (10)" data-param="attachments" data-upload-path="/uploads.js" multiple="multiple" name="attachments[dummy][file]" onchange="addInputFiles(this);" type="file">
                (Maximum size: 5 MB)
              </span>
            </span>
          </p>
        </div>
        <script>//<![CDATA[
var wikiToolbar = new jsToolBar(document.getElementById('document_description')); wikiToolbar.setHelpLink('/help/wiki_syntax'); wikiToolbar.setPreviewUrl('/preview/text'); wikiToolbar.draw();
//]]></script>
        <p>
          <input data-disable-with="Create" name="commit" type="submit" value="Create">
          <a href="#" onclick="$(&#34;#add-document&#34;).hide(); return false;">Cancel</a>
        </p>
      </form>
    </div>
    <h2>Documents</h2>
    <div id="document-list">
      <div class="document-group document-group-category">
        <h3 class="group-name">Uncategorized</h3>
        <div class="document-item document-1">
          <h4 class="title">
            <a href="/documents/1">Test document</a>
          </h4>
          <div class="updated_on">
            <em>02/12/2007 02:08 PM</em>
          </div>
          <div class="wiki description">
            <p>Document description</p>
          </div>
        </div>
        <div class="document-item document-2">
          <h4 class="title">
            <a href="/documents/2">An other document</a>
          </h4>
          <div class="updated_on">
            <em>02/12/2007 02:08 PM</em>
          </div>
          <div class="wiki description"></div>
        </div>
      </div>
      <div class="document-group document-group-category">
        <h3 class="group-name">Technical documentation</h3>
        <div class="document-item document-3">
          <h4 class="title">
            <a href="/documents/3">An other document 2</a>
          </h4>
          <div class="updated_on">
            <em>03/05/2007 02:08 PM</em>
          </div>
          <div class="wiki description"></div>
        </div>
      </div>
    </div>
  </body>
</html>
