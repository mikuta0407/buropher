# 許容差分リスト（buropher の意図的な差分）。追加時は必ず reason を書き、レビュー対象にする。
#
# entries:
#   - case: "smoke/issues_1__*"        # "<scenario>/<case id>" の glob
#     reason: "追加機能のボタン"
#     lines:                            # 差分行（先頭の +/- を除く）がすべていずれかに一致すれば許容
#       - '^\s*<a class="buropher-extra"'
#   - case: "smoke/settings__admin"
#     reason: "設定画面は未実装"
#     ignore: true                      # ケース全体を許容
entries:
  # ---- admin_masters（ロール・トラッカー・ステータス・列挙） ----
  - case: "admin_masters/roles_*.json__*"
    reason: "ロールの権限の保存順を持たない（role_permissions に順序列がない）ため API では AccessControl の定義順で出す"
    lines:
      - '^\s*"[a-z_]+",?$'
  - case: "admin_masters/roles_*.xml__*"
    reason: "ロールの権限の保存順を持たない（role_permissions に順序列がない）ため API では AccessControl の定義順で出す"
    lines:
      - '^\s*<permission>[a-z_]+</permission>$'
  - case: "admin_masters*/*enumerations_*"
    reason: "フィクスチャのカスタム値 true（SQLite に 't' で保存）はインポートで '1' に正規化される"
    lines:
      - '^\s*<option (selected="selected" )?value="1">Yes</option>$'
      - '^\s*"value": "(t|1)"$'
      - '^\s*<value>(t|1)</value>$'

  # ---- projects（プロジェクト・メンバー・カテゴリ） ----
  - case: "projects*/*settings*"
    reason: "フィクスチャのカスタム値 true（SQLite に 't' で保存）はインポートで '1' に正規化される（作業分類タブの選択状態）"
    lines:
      - '^\s*<option (selected="selected" )?value="1">Yes</option>$'
  # ---- admin_users（ユーザー・グループ） ----
  - case: "admin_users/*"
    reason: "time_zone_select の Casablanca の基準オフセットは internal/i18n/zones_gen.go の生成時点の値（+00:00）で、参照（固定時刻 2026-01-15）は +01:00。並び位置も変わる。zones_gen.go を参照時刻で再生成すれば解消する"
    lines:
      - '^\s*<option value="Casablanca">\(GMT\+0[01]:00\) Casablanca</option>$'

  # ---- wiki ----
  - case: "wiki*/*"
    reason: "フィクスチャの wiki_contents に対応する wiki_content_versions が無いページ（Child_1 等）。buropher は wiki_contents と履歴を wiki_page_versions に統合するため、最新版も履歴の 1 件として数える（実データでは最新版は必ず履歴にもある）"
    lines:
      - '^\s*<a href="[^"]*/history">[01] revisions</a>$'
  - case: "wiki*/projects_ecookbook_wiki_CookBook_documentation_3__*"
    reason: "フィクスチャの CookBook_documentation は wiki_contents（v3: child_pages 入りの本文・コメント付き）と wiki_content_versions の v3（別の本文）が食い違う。buropher は統合時に wiki_contents を優先するため、版 3 の本文・コメントを使う画面（履歴・差分・注釈・版 3 の表示）が異なる"
    ignore: true
  - case: "wiki*/projects_ecookbook_wiki_CookBook_documentation_history__*"
    reason: "フィクスチャの CookBook_documentation は wiki_contents（v3: child_pages 入りの本文・コメント付き）と wiki_content_versions の v3（別の本文）が食い違う。buropher は統合時に wiki_contents を優先するため、版 3 の本文・コメントを使う画面（履歴・差分・注釈・版 3 の表示）が異なる"
    ignore: true
  - case: "wiki*/projects_ecookbook_wiki_CookBook_documentation_diff__*"
    reason: "フィクスチャの CookBook_documentation は wiki_contents（v3: child_pages 入りの本文・コメント付き）と wiki_content_versions の v3（別の本文）が食い違う。buropher は統合時に wiki_contents を優先するため、版 3 の本文・コメントを使う画面（履歴・差分・注釈・版 3 の表示）が異なる"
    ignore: true
  - case: "wiki*/projects_ecookbook_wiki_CookBook_documentation_diff_version_3_version_from_1__*"
    reason: "フィクスチャの CookBook_documentation は wiki_contents（v3: child_pages 入りの本文・コメント付き）と wiki_content_versions の v3（別の本文）が食い違う。buropher は統合時に wiki_contents を優先するため、版 3 の本文・コメントを使う画面（履歴・差分・注釈・版 3 の表示）が異なる"
    ignore: true
  - case: "wiki*/projects_ecookbook_wiki_CookBook_documentation_3_annotate__*"
    reason: "フィクスチャの CookBook_documentation は wiki_contents（v3: child_pages 入りの本文・コメント付き）と wiki_content_versions の v3（別の本文）が食い違う。buropher は統合時に wiki_contents を優先するため、版 3 の本文・コメントを使う画面（履歴・差分・注釈・版 3 の表示）が異なる"
    ignore: true
  - case: "wiki_write/diff_after_update__*"
    reason: "フィクスチャの Another_page の版 1 は wiki_contents（include マクロ入り）と wiki_content_versions（短い本文）が食い違う。buropher は統合時に wiki_contents を優先するため、版 1 との差分が異なる"
    ignore: true
  - case: "wiki_write/history_after_destroy_version__*"
    reason: "フィクスチャの CookBook_documentation の版 3 のコメントが wiki_contents と wiki_content_versions で食い違う（統合時に wiki_contents を優先）"
    lines:
      - '^\s*<td class="comments">(Gzip compression activated)?</td>$'
  # ---- activity_search（活動・検索） ----
  - case: "activity_search/activity_from_2007-03-06_show_wiki_edits_*"
    reason: "wiki_page_versions は wiki_contents と wiki_content_versions を統合して持ち、同じ版は wiki_contents を優先する（docs/schema.md）。フィクスチャの CookBook_documentation 版 3 は wiki_contents のコメント（Gzip compression activated）と wiki_content_versions のコメント（空）が食い違うため活動の説明が異なる"
    lines:
      - '^\s*<span class="description">(Gzip compression activated)?</span>$'

  # ---- issues_read（チケットの参照系） ----
  - case: "issues_read/issues_changes.atom__*"
    reason: "journals#index は created_on DESC だけで並べるため、同時刻のジャーナル（フィクスチャの 2026-01-14 の 4 件）の順序は参照の SQLite の実行計画に依存する。buropher は id DESC で揃える（同時刻を含まない条件のケースは別に一致を確認している）"
    ignore: true
  - case: "issues_read/issues_changes.atom_project_id_ecookbook__*"
    reason: "journals#index は created_on DESC だけで並べるため、同時刻のジャーナル（フィクスチャの 2026-01-14 の 4 件）の順序は参照の SQLite の実行計画に依存する。buropher は id DESC で揃える（同時刻を含まない条件のケースは別に一致を確認している）"
    ignore: true
  - case: "issues_read/*.json*"
    reason: "空文字列は NULL で保存する（docs/schema.md の '' → NULL）ため、添付ファイル等の description: \"\" は null になる"
    lines:
      - '^\s*"description": (null|""),?$'
  - case: "issues_read/*.xml*"
    reason: "空文字列は NULL で保存する（docs/schema.md の '' → NULL）ため、添付ファイル等の <description></description> は <description/> になる"
    lines:
      - '^\s*<description(/>|></description>)$'
  - case: "settings_admin*/*settings*"
    reason: "buropher は SCM として Git のみ対応する（D-15）ため、設定画面のリポジトリタブの SCM 表には Git の行だけを出す。Casablanca の基準オフセットは admin_users と同じ理由（zones_gen.go の生成時点の値）"
    lines:
      - '^\s*</?(tr|td|label)>$'
      - '^\s*<td class="scm_name">$'
      - '^\s*<td></td>$'
      - '^\s*<input (checked="checked" )?name="settings\[enabled_scm\]\[\]" type="checkbox" value="(Subversion|Mercurial|Cvs|Bazaar|Filesystem)">$'
      - '^\s*(Subversion|Mercurial|Cvs|Bazaar|Filesystem|svn|hg|cvs|bzr)$'
      - '^\s*<span class="icon icon-(ok|error)"></span>$'
      - '^\s*<option value="Casablanca">\(GMT\+0[01]:00\) Casablanca</option>$'
  - case: "settings_admin/admin_info__admin"
    reason: "admin#info は意図的に buropher のバージョン・Go のバージョン・DB アダプタ等を表示する（Redmine の Ruby / Rails / ImageMagick の確認項目は持たない）。レイアウトと CSS クラスは同じ"
    ignore: true

  # ---- content（ニュース・文書・ファイル・フォーラム・添付）
  - case: "content*/attachments_issues_14_edit__*"
    reason: "フィクスチャの attachments.description の空文字はインポートで NULL に正規化されるため、空の説明欄に value=\"\" が付かない"
    lines:
      - '^\s*<input id="attachments_\d+_description" name="attachments\[\d+\]\[description\]" placeholder="Optional description" size="80" type="text"( value="")?>$'

  # ---- issues_write（チケットの作成・更新） ----
  - case: "issues_write*/*"
    reason: "custom_values.value は '' を NULL で保存する（docs/schema.md の '' → NULL）ため、保存後に値の無いカスタムフィールド（Redmine では nil の行）を '' として読み、入力欄に value=\"\" が付く"
    lines:
      - '^\s*<input class="(date|string|float|int)_cf cf_\d+" id="issue_custom_field_values_\d+"( max="9999-12-31")? name="issue\[custom_field_values\]\[\d+\]"( size="10")? type="(date|text)"( value="")?>$'
