# 許容差分リスト（buropher の意図的な差分）。追加時は必ず reason を書き、レビュー対象にする。
#
# entries:
#   - case: "smoke/issues_1__*"        # "<scenario>/<case id>" の glob
#     reason: "追加機能のボタン"
#     lines:                            # 差分行（先頭の +/- を除く）がすべていずれかに一致すれば許容
#       - '^\s*<a class="buropher-extra"'
#   - case: "smoke/settings__admin"
#     reason: "設定画面は未実装"
#     ignore: true                      # ケース全体を許容
entries:
  # ---- admin_masters（ロール・トラッカー・ステータス・列挙） ----
  - case: "admin_masters/roles_*.json__*"
    reason: "ロールの権限の保存順を持たない（role_permissions に順序列がない）ため API では AccessControl の定義順で出す"
    lines:
      - '^\s*"[a-z_]+",?$'
  - case: "admin_masters/roles_*.xml__*"
    reason: "ロールの権限の保存順を持たない（role_permissions に順序列がない）ため API では AccessControl の定義順で出す"
    lines:
      - '^\s*<permission>[a-z_]+</permission>$'
  - case: "admin_masters*/*enumerations_*"
    reason: "フィクスチャのカスタム値 true（SQLite に 't' で保存）はインポートで '1' に正規化される"
    lines:
      - '^\s*<option (selected="selected" )?value="1">Yes</option>$'
      - '^\s*"value": "(t|1)"$'
      - '^\s*<value>(t|1)</value>$'

